<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#fff5fb;color:#493d60;font-family:Arial,sans-serif}
main{max-width:850px;margin:auto;background:#fff;border-radius:32px;padding:clamp(18px,4vw,38px);box-shadow:0 8px 30px #6548a015}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{background:#f0e5ff;color:#7041bd;border-radius:30px;padding:10px 18px;font-size:clamp(15px,3vw,25px);letter-spacing:1px}
.brain{font-size:30px}
h1{text-align:center;font-size:clamp(34px,7vw,64px);margin:30px 0 12px}
.sub{text-align:center;color:#918795;font-size:clamp(18px,3.5vw,30px);line-height:1.35;margin:0 auto 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{border-radius:22px;padding:18px 5px;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.stat:nth-child(1){background:#f5e9fc;color:#805a9f}.stat:nth-child(2){background:#e4f3ff;color:#4d8db6}.stat:nth-child(3){background:#fff0dc;color:#a77a3b}
.stat span{font-size:clamp(15px,2.8vw,25px)}.stat strong{font-size:clamp(28px,5vw,46px)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{aspect-ratio:1;border:0;border-radius:clamp(18px,4vw,34px);background:#b99be9;color:white;font-size:clamp(34px,7vw,62px);cursor:pointer}
.card.open,.card.matched{background:#e3f6eb;border:4px solid #a8ddc0;color:#4c5260}
.card.matched{cursor:default}
.message{margin:18px 0;background:#f8f1fc;border-radius:24px;padding:22px;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.message strong{font-size:clamp(20px,3.5vw,34px);color:#76558f;line-height:1.35}
.message span{font-size:clamp(16px,2.8vw,25px);color:#94889d;text-align:center}
.restart{width:100%;border:0;border-radius:50px;background:#00a83e;color:white;padding:18px;font-size:clamp(19px,3.5vw,30px);cursor:pointer}
footer{text-align:center;color:#94899b;font-size:18px;padding:24px 5px 5px}
@media(max-width:420px){body{padding:8px}.stats{gap:7px}.stat{min-height:95px;border-radius:16px}.board{gap:8px}.card{border-radius:18px}.message{padding:18px}}
</style>
</head>
<body>
<main>
 <div class="top"><div class="tag">JOGO DA MEMÓRIA</div><div class="brain">🧠</div></div>
 <h1>Encontre os pares!</h1>
 <p class="sub">Memorize as cartas e encontre os objetos iguais.</p>
 <section class="stats">
  <div class="stat"><span>Tentativas</span><strong id="attempts">0</strong></div>
  <div class="stat"><span>Pares</span><strong id="pairs">0/4</strong></div>
  <div class="stat"><span>Cartas</span><strong id="cards">0/8</strong></div>
 </section>
 <section class="board" id="board"></section>
 <section class="message" aria-live="polite">
  <strong id="headline">👋 Vamos começar?</strong>
  <span id="hint">Toque em duas cartas para jogar</span>
 </section>
 <button class="restart" id="restart" type="button">⟳ Reiniciar partida</button>
</main>
<footer>Prévia interativa • 8 cartas • 4 pares</footer>
<script>
(function(){
 const objetos = ["📷","🎧","⌚","🎒"];
 const tabuleiro = document.getElementById("board");
 const tentativasEl = document.getElementById("attempts");
 const paresEl = document.getElementById("pairs");
 const cartasEl = document.getElementById("cards");
 const tituloEl = document.getElementById("headline");
 const dicaEl = document.getElementById("hint");
 let primeira = null, bloqueado = false, tentativas = 0, pares = 0, abertas = 0, timerFechar = null;

 function embaralhar(lista){
   for(let i=lista.length-1;i>0;i--){
     const j=Math.floor(Math.random()*(i+1));
     [lista[i],lista[j]]=[lista[j],lista[i]];
   }
   return lista;
 }
 function atualizar(){
   tentativasEl.textContent=tentativas;
   paresEl.textContent=pares+"/4";
   cartasEl.textContent=abertas+"/8";
 }
 function virar(carta){
   if(bloqueado || carta.classList.contains("open") || carta.classList.contains("matched")) return;
   carta.classList.add("open");
   carta.textContent=carta.dataset.objeto;
   carta.setAttribute("aria-label","Carta "+carta.dataset.objeto);
   abertas++;
   atualizar();

   if(primeira===null){
     primeira=carta;
     return;
   }
   tentativas++;
   atualizar();

   if(primeira.dataset.objeto===carta.dataset.objeto){
     primeira.classList.add("matched");
     carta.classList.add("matched");
     primeira=null;
     pares++;
     atualizar();
     tituloEl.textContent="🎉 Muito bem! Você encontrou um par!";
     dicaEl.textContent=pares===4 ? "Parabéns! Você encontrou todos os pares!" : "Continue assim! Encontre os outros pares.";
     if(pares===4) tituloEl.textContent="🏆 Parabéns! Você venceu!";
   }else{
     bloqueado=true;
     tituloEl.textContent="💜 Quase! Tente mais uma vez.";
     dicaEl.textContent="Memorize as posições e procure os objetos iguais.";
     const anterior=primeira;
     primeira=null;
     timerFechar=setTimeout(function(){
       anterior.classList.remove("open");
       carta.classList.remove("open");
       anterior.textContent="?";
       carta.textContent="?";
       anterior.setAttribute("aria-label","Carta fechada");
       carta.setAttribute("aria-label","Carta fechada");
       abertas-=2;
       atualizar();
       bloqueado=false;
     },900);
   }
 }
 function iniciar(){
   if(timerFechar!==null){clearTimeout(timerFechar);timerFechar=null;}
   primeira=null;bloqueado=false;tentativas=0;pares=0;abertas=0;
   atualizar();
   tituloEl.textContent="👋 Vamos começar?";
   dicaEl.textContent="Toque em duas cartas para jogar";
   tabuleiro.innerHTML="";
   const baralho=embaralhar(objetos.concat(objetos));
   baralho.forEach(function(objeto,indice){
     const carta=document.createElement("button");
     carta.type="button";
     carta.className="card";
     carta.textContent="?";
     carta.dataset.objeto=objeto;
     carta.setAttribute("aria-label","Carta "+(indice+1)+" fechada");
     carta.addEventListener("click",function(){virar(carta);});
     tabuleiro.appendChild(carta);
   });
 }
 document.getElementById("restart").addEventListener("click",iniciar);
 iniciar();
})();
</script>
</body>
</html>
